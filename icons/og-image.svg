<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Gold accent line -->
  <rect x="80" y="200" width="60" height="3" fill="#C5A870"/>
  <!-- Brand name -->
  <text x="80" y="170" font-family="Georgia, serif" font-size="22" fill="#C5A870" letter-spacing="8">VAYU HOLIDAYS</text>
  <!-- Main headline -->
  <text x="80" y="290" font-family="Georgia, serif" font-size="72" fill="#FFFFFF" font-weight="300">Your Journey.</text>
  <text x="80" y="370" font-family="Georgia, serif" font-size="72" fill="#C5A870" font-style="italic" font-weight="300">Beautifully Planned.</text>
  <!-- Subtext -->
  <text x="80" y="440" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.65)">Luxury Travel Agency &amp; Tour Operator — Bhopal, India</text>
  <!-- Bottom bar -->
  <rect x="0" y="580" width="1200" height="50" fill="rgba(197,168,112,0.15)"/>
  <text x="80" y="612" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.5)">Kashmir · Kerala · Dubai · Bali · Switzerland · Maldives</text>
  <text x="1120" y="612" font-family="Arial, sans-serif" font-size="18" fill="#C5A870" text-anchor="end">vayuholidays.com</text>
</svg>
