<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>No Connection — Vayu Holidays</title>
  <style>
    :root {
      --color-obsidian: #090D12;
      --color-gold: #C5A880;
      --color-ivory: #FCFBF7;
      --font-serif: 'Georgia', serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--color-obsidian);
      color: var(--color-ivory);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .icon { font-size: 4rem; margin-bottom: 1.5rem; }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      color: var(--color-gold);
      margin-bottom: 1rem;
      font-weight: 400;
    }
    p { color: rgba(255,255,255,0.7); line-height: 1.7; margin-bottom: 2rem; max-width: 480px; }
    .btn {
      display: inline-block;
      background: var(--color-gold);
      color: var(--color-obsidian);
      padding: 0.85rem 2rem;
      border-radius: 9999px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      font-size: 1rem;
    }
    .contact {
      margin-top: 3rem;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.5);
    }
    .contact a { color: var(--color-gold); text-decoration: none; }
  </style>
</head>
<body>
  <div>
    <div class="icon">✈️</div>
    <h1>You're Offline</h1>
    <p>
      It seems you've lost your internet connection. Please check your network and try again. 
      Your previously visited pages may still be available from cache.
    </p>
    <button class="btn" onclick="window.location.reload()">Try Again</button>
    <div class="contact">
      Need urgent travel help? Call us: 
      <a href="tel:+917554928899">+91 755 492 8899</a> or 
      <a href="https://wa.me/919826012345">WhatsApp</a>
    </div>
  </div>
</body>
</html>
